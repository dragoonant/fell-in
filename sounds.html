<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound audition</title>
<style>
body{margin:0;padding:16px;background:#1d1a16;color:#e8dfc8;font:14px system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}p{margin:0 0 12px;color:#b8ab8c}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
button{padding:10px;background:#2c2720;color:#e8dfc8;border:1px solid #8a7a5c;border-radius:4px;cursor:pointer}
button:hover{background:#3a332a}.m{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
</style></head><body>
<h1>Sound audition</h1>
<p>Procedural synth, no audio files. Bundled with the app build.</p>
<div id="grid"></div>
<div class="m"><button id="calm">Music: calm</button><button id="battle">Music: battle</button><button id="stop">Music: stop</button></div>
<script type="module">
import * as mod from './src/client/audio/synth.ts'
const ctx = new (window.AudioContext || window.webkitAudioContext)()
const out = ctx.createGain(); out.gain.value = 0.8; out.connect(ctx.destination)
const music = ctx.createGain(); music.gain.value = 0.2; music.connect(ctx.destination)
const grid = document.getElementById('grid')
for (const id of mod.SOUND_IDS) {
  const b = document.createElement('button'); b.textContent = id; b.dataset.sound = id
  b.onclick = async () => { await ctx.resume(); mod.RECIPES[id]({ ctx, out, t: ctx.currentTime + 0.02, p: 1, v: 1 }) }
  grid.appendChild(b)
}
let player = null, timer = null
function mood(m) {
  if (player) player.fadeOut(1.8)
  clearInterval(timer); player = null
  if (!m) return
  player = new mod.MoodPlayer(ctx, music, m, 1.8)
  const p = player
  timer = setInterval(() => p.tick(ctx.currentTime + 0.5), 120)
}
for (const m of ['calm', 'battle']) document.getElementById(m).onclick = async () => { await ctx.resume(); mood(m) }
document.getElementById('stop').onclick = () => mood(null)
</script></body></html>
